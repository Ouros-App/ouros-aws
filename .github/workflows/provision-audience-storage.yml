name: Provision audience storage

on:
  workflow_dispatch:
    inputs:
      s3_prefix:
        description: Must match S3_PREFIX configured in the audience service
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: provision-audience-storage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  provision:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Install AWS CLI
        run: python -m pip install --disable-pip-version-check awscli

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get update
          sudo apt-get install -y infisical

      - name: Prepare AWS Academy credentials
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_ENV: ${{ secrets.INFISICAL_ENV }}
          INFISICAL_PATH: ${{ secrets.INFISICAL_PATH }}
          INFISICAL_HOST: ${{ secrets.INFISICAL_HOST }}
        run: |
          infisical run \
            --projectId="$INFISICAL_PROJECT_ID" \
            --env="$INFISICAL_ENV" \
            --path="$INFISICAL_PATH" \
            --domain="$INFISICAL_HOST" \
            -- python -m academy.bootstrap

      - name: Import existing resources and apply Terraform
        working-directory: terraform/audience-storage
        env:
          S3_PREFIX: ${{ inputs.s3_prefix }}
        run: |
          export TF_VAR_aws_region="${AWS_REGION:-us-east-1}"
          export TF_VAR_s3_prefix="$S3_PREFIX"
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          BUCKET_NAME="ouros-audience-engine-${ACCOUNT_ID}"
          LOG_BUCKET="$(python -c 'import hashlib,sys; name=sys.argv[1]; print(name[:50] + "-logs-" + hashlib.sha256(name.encode()).hexdigest()[:6])' "$BUCKET_NAME")"
          main_bucket_exists=false
          import_audience_logging=false

          terraform init -input=false

          # The runner is ephemeral; import this service bucket into a local state on every dispatch.
          if aws s3api head-bucket --bucket "$BUCKET_NAME" >/dev/null 2>&1; then
            main_bucket_exists=true
            terraform import -input=false aws_s3_bucket.audience "$BUCKET_NAME"

            source_logging="$RUNNER_TEMP/audience-source-logging.json"
            logging_error="$RUNNER_TEMP/audience-source-logging-error.txt"
            if ! aws s3api get-bucket-logging --bucket "$BUCKET_NAME" >"$source_logging" 2>"$logging_error"; then
              cat "$logging_error" >&2
              echo '::error::Could not safely inspect the audience bucket logging configuration.'
              exit 1
            fi
            if jq -e '.LoggingEnabled.TargetBucket' "$source_logging" >/dev/null; then
              current_log_bucket="$(jq -r '.LoggingEnabled.TargetBucket' "$source_logging")"
              if [ "$current_log_bucket" != "$LOG_BUCKET" ] || ! jq -e --arg prefix "$BUCKET_NAME/" '.LoggingEnabled.TargetPrefix == $prefix' "$source_logging" >/dev/null; then
                echo '::error::The audience bucket has a different access-log destination or prefix.'
                exit 1
              fi
              import_audience_logging=true
            fi

            public_block="$RUNNER_TEMP/audience-public-access.json"
            public_block_error="$RUNNER_TEMP/audience-public-access-error.txt"
            if aws s3api get-public-access-block --bucket "$BUCKET_NAME" >"$public_block" 2>"$public_block_error"; then
              terraform import -input=false aws_s3_bucket_public_access_block.audience "$BUCKET_NAME"
            elif ! grep -q 'NoSuchPublicAccessBlockConfiguration' "$public_block_error"; then
              cat "$public_block_error" >&2
              echo '::error::Could not safely inspect the audience bucket public access block.'
              exit 1
            fi

            encryption="$RUNNER_TEMP/audience-encryption.json"
            encryption_error="$RUNNER_TEMP/audience-encryption-error.txt"
            if aws s3api get-bucket-encryption --bucket "$BUCKET_NAME" >"$encryption" 2>"$encryption_error"; then
              if ! jq -e '
                (.ServerSideEncryptionConfiguration.Rules | length == 1) and
                .ServerSideEncryptionConfiguration.Rules[0].ApplyServerSideEncryptionByDefault.SSEAlgorithm == "AES256"
              ' "$encryption" >/dev/null; then
                echo '::error::The existing bucket has encryption settings this workflow will not replace.'
                exit 1
              fi
              terraform import -input=false aws_s3_bucket_server_side_encryption_configuration.audience "$BUCKET_NAME"
            elif ! grep -q 'ServerSideEncryptionConfigurationNotFoundError' "$encryption_error"; then
              cat "$encryption_error" >&2
              echo '::error::Could not safely inspect the audience bucket encryption.'
              exit 1
            fi

            policy="$RUNNER_TEMP/audience-bucket-policy.json"
            policy_error="$RUNNER_TEMP/audience-bucket-policy-error.txt"
            if aws s3api get-bucket-policy --bucket "$BUCKET_NAME" --query Policy --output text >"$policy" 2>"$policy_error"; then
              if ! jq -e --arg bucket_arn "arn:aws:s3:::$BUCKET_NAME" '
                (.Statement | type == "array" and length == 1) and
                .Statement[0].Sid == "DenyInsecureTransport" and
                .Statement[0].Effect == "Deny" and
                .Statement[0].Action == "s3:*" and
                .Statement[0].Principal == "*" and
                (.Statement[0].Resource | type == "array" and length == 2 and sort == [$bucket_arn, ($bucket_arn + "/*")]) and
                .Statement[0].Condition.Bool["aws:SecureTransport"] == "false"
              ' "$policy" >/dev/null; then
                echo '::error::The existing bucket has a custom policy this workflow will not replace.'
                exit 1
              fi
              terraform import -input=false aws_s3_bucket_policy.https_only "$BUCKET_NAME"
            elif ! grep -q 'NoSuchBucketPolicy' "$policy_error"; then
              cat "$policy_error" >&2
              echo '::error::Could not safely inspect the audience bucket policy.'
              exit 1
            fi
          fi

          if aws s3api head-bucket --bucket "$LOG_BUCKET" >/dev/null 2>&1; then
            if [ "$main_bucket_exists" != true ]; then
              echo '::error::The access-log bucket exists without its audience bucket; refusing to adopt it.'
              exit 1
            fi
            terraform import -input=false aws_s3_bucket.access_logs "$LOG_BUCKET"

            if aws s3api get-public-access-block --bucket "$LOG_BUCKET" >/dev/null 2>&1; then
              terraform import -input=false aws_s3_bucket_public_access_block.access_logs "$LOG_BUCKET"
            fi

            logs_encryption_error="$RUNNER_TEMP/audience-logs-encryption-error.txt"
            if logs_sse_algorithm="$(aws s3api get-bucket-encryption --bucket "$LOG_BUCKET" \
              --query 'ServerSideEncryptionConfiguration.Rules[0].ApplyServerSideEncryptionByDefault.SSEAlgorithm' \
              --output text 2>"$logs_encryption_error")"; then
              if [ "$logs_sse_algorithm" != "AES256" ]; then
                echo "::error::The access-log bucket uses $logs_sse_algorithm encryption; this workflow requires SSE-S3."
                exit 1
              fi
              terraform import -input=false aws_s3_bucket_server_side_encryption_configuration.access_logs "$LOG_BUCKET"
            elif ! grep -q 'ServerSideEncryptionConfigurationNotFoundError' "$logs_encryption_error"; then
              cat "$logs_encryption_error" >&2
              echo '::error::Could not safely inspect access-log bucket encryption.'
              exit 1
            fi

            logs_policy="$RUNNER_TEMP/audience-logs-policy.json"
            logs_policy_error="$RUNNER_TEMP/audience-logs-policy-error.txt"
            if aws s3api get-bucket-policy --bucket "$LOG_BUCKET" --query Policy --output text >"$logs_policy" 2>"$logs_policy_error"; then
              if jq -e --arg log_arn "arn:aws:s3:::$LOG_BUCKET" --arg source_arn "arn:aws:s3:::$BUCKET_NAME" --arg source_bucket "$BUCKET_NAME" --arg account_id "$ACCOUNT_ID" '
                (.Statement | type == "array" and length == 2) and
                ([.Statement[].Sid] | sort == ["AllowS3ServerAccessLogs", "DenyInsecureTransport"]) and
                any(.Statement[]; .Sid == "AllowS3ServerAccessLogs" and .Effect == "Allow" and .Principal.Service == "logging.s3.amazonaws.com" and .Action == "s3:PutObject" and .Resource == ($log_arn + "/" + $source_bucket + "/*") and .Condition.ArnLike["aws:SourceArn"] == $source_arn and .Condition.StringEquals["aws:SourceAccount"] == $account_id) and
                any(.Statement[]; .Sid == "DenyInsecureTransport" and .Effect == "Deny" and .Action == "s3:*" and .Principal == "*" and (.Resource | type == "array" and length == 2 and sort == [$log_arn, ($log_arn + "/*")]) and .Condition.Bool["aws:SecureTransport"] == "false")
              ' "$logs_policy" >/dev/null; then
                terraform import -input=false aws_s3_bucket_policy.access_logs "$LOG_BUCKET"
              else
                echo '::error::The access-log bucket has a custom policy this workflow will not replace.'
                exit 1
              fi
            elif ! grep -q 'NoSuchBucketPolicy' "$logs_policy_error"; then
              cat "$logs_policy_error" >&2
              echo '::error::Could not safely inspect access-log bucket policy.'
              exit 1
            fi

            logs_lifecycle="$RUNNER_TEMP/audience-logs-lifecycle.json"
            logs_lifecycle_error="$RUNNER_TEMP/audience-logs-lifecycle-error.txt"
            if aws s3api get-bucket-lifecycle-configuration --bucket "$LOG_BUCKET" >"$logs_lifecycle" 2>"$logs_lifecycle_error"; then
              if jq -e --arg prefix "$BUCKET_NAME/" '
                .Rules == [{"ID":"expire-access-logs","Filter":{"Prefix":$prefix},"Status":"Enabled","Expiration":{"Days":30}}]
              ' "$logs_lifecycle" >/dev/null; then
                terraform import -input=false aws_s3_bucket_lifecycle_configuration.access_logs "$LOG_BUCKET"
              else
                echo '::error::The access-log bucket has a custom lifecycle configuration this workflow will not replace.'
                exit 1
              fi
            elif ! grep -q 'NoSuchLifecycleConfiguration' "$logs_lifecycle_error"; then
              cat "$logs_lifecycle_error" >&2
              echo '::error::Could not safely inspect access-log bucket lifecycle.'
              exit 1
            fi
          fi

          if [ "$import_audience_logging" = true ]; then
            terraform import -input=false aws_s3_bucket_logging.audience "$BUCKET_NAME"
          fi

          terraform plan -input=false -out=tfplan
          terraform show -json tfplan > "$RUNNER_TEMP/audience-storage-plan.json"
          unsafe_changes="$(jq -r '
            [.resource_changes[]?
              | select((.change.actions | index("delete")) != null)
              | .address]
            | .[]
          ' "$RUNNER_TEMP/audience-storage-plan.json")"
          if [ -n "$unsafe_changes" ]; then
            printf '::error::Terraform plan contains destructive changes:\n%s\n' "$unsafe_changes"
            exit 1
          fi

          terraform apply -input=false -auto-approve tfplan
          {
            echo '### Audience Engine S3 storage'
            echo "- Access logs bucket: \`$(terraform output -raw access_logs_bucket_name)\` (30-day retention)"
            echo "- Bucket: \`$(terraform output -raw bucket_name)\`"
            echo "- Region: \`$TF_VAR_aws_region\`"
            echo "- S3 prefix: \`$(terraform output -raw s3_prefix)\`"
            echo '- Attach this policy to the service AWS identity before use:'
            echo '```json'
            terraform output -raw runtime_access_policy_json | jq .
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
