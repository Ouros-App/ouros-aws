name: Deploy to S3

on:
  workflow_dispatch:
    inputs:
      source_dir:
        description: Build output directory to publish
        required: true
        default: dist
      bucket:
        description: Existing bucket name (must be allowed by Learner Lab)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-s3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Install AWS CLI
        run: python -m pip install --disable-pip-version-check awscli
      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get update
          sudo apt-get install -y infisical
      - name: Prepare Academy credentials
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_ENV: ${{ secrets.INFISICAL_ENV }}
          INFISICAL_PATH: ${{ secrets.INFISICAL_PATH }}
          INFISICAL_HOST: ${{ secrets.INFISICAL_HOST }}
        run: |
          infisical run \
            --token="$INFISICAL_TOKEN" \
            --projectId="$INFISICAL_PROJECT_ID" \
            --env="$INFISICAL_ENV" \
            --path="$INFISICAL_PATH" \
            --domain="$INFISICAL_HOST" \
            -- python -m academy.bootstrap
      - name: Publish files
        env:
          S3_BUCKET: ${{ inputs.bucket }}
          SOURCE_DIR: ${{ inputs.source_dir }}
        run: |
          test -d "$SOURCE_DIR" || { echo '::error::Source directory does not exist'; exit 1; }
          aws s3 sync "$SOURCE_DIR" "s3://${S3_BUCKET}" --delete
