name: AWS Academy healthcheck

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academy-healthcheck-${{ github.ref }}
  cancel-in-progress: false

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install AWS CLI
        run: python -m pip install --disable-pip-version-check awscli
      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get update
          sudo apt-get install -y infisical
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Bootstrap Learner Lab and validate AWS identity
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_ENV: ${{ secrets.INFISICAL_ENV }}
          INFISICAL_PATH: ${{ secrets.INFISICAL_PATH }}
          INFISICAL_HOST: ${{ secrets.INFISICAL_HOST }}
        run: |
          infisical run \
            --token="$INFISICAL_TOKEN" \
            --projectId="$INFISICAL_PROJECT_ID" \
            --env="$INFISICAL_ENV" \
            --path="$INFISICAL_PATH" \
            --domain="$INFISICAL_HOST" \
            -- python -m academy.bootstrap
